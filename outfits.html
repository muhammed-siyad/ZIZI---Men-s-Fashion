<body>

  <!-- HEADER -->

  <header>

    <h1>ZIZI</h1>

    <nav>

      <ul>

        <li>

  <!-- OUTFITS -->

  <section id="outfits" class="category-section">

    <h1>OUTFITS</h1>


    <!-- ROW 1 -->

    <div class="product-grid">


      <!-- MODERN FIT SUIT -->

      <div class="product-card">

        <img
          src="img/suit.jpg"
          alt="Modern Fit Suit"
        >

        <h3>Modern Fit Suit</h3>

        <p>₹5220</p>

        <button
          onclick="addToCart('Modern Fit Suit', 5220, 'img/suit.jpg')"
        >
          Add to Cart
        </button>

      </div>


      <!-- TRADITIONAL WEAR -->

      <div class="product-card">

        <img
          src="img/tredtional.jpg"
          alt="Traditional Wear"
        >

        <h3>Traditional Wear</h3>

        <p>₹1550</p>

        <button
          onclick="addToCart('Traditional Wear', 1550, 'img/tredtional.jpg')"
        >
          Add to Cart
        </button>

      </div>


      <!-- CASUAL FIT -->

      <div class="product-card">

        <img
          src="img/outfit  (1).jpeg"
          alt="Casual Fit"
        >

        <h3>Casual Fit</h3>

        <p>₹2000</p>

        <button
          onclick="addToCart('Casual Fit', 2000, 'img/outfit  (1).jpeg')"
        >
          Add to Cart
        </button>

      </div>


      <!-- STREET WEAR -->

      <div class="product-card">

        <img

    <div class="product-grid">

      <div class="product-card">

        <img
          src="img/outfit  (3).jpeg"
          alt="Formal Fit Suit"
        >

        <h3>Formal Fit Suit</h3>

        <p>₹4220</p>

        <button
          onclick="addToCart('Formal Fit Suit', 4220, 'img/outfit  (3).jpeg')"
        >
          Add to Cart
        </button>

      </div>


      <!-- CASUAL FIT 2 -->

      <div class="product-card">

        <img
          src="img/outfit  (2).jpeg"
          alt="Casual Fit"

        <h3>Casual Fit</h3>

        <p>₹1550</p>

        <button
          onclick="addToCart('Casual Fit 2', 1550, 'img/outfit  (2).jpeg')"

      <div class="product-card">

        <img
          src="img/outfit 1.jpeg"

        <h3>Old Money</h3>

        <p>₹1799</p>

        <button
          onclick="addToCart('Old Money', 1799, 'img/outfit 1.jpeg')"

          Add to Cart
        </button>

      <div class="product-card">

        <img
          src="img/outfit 2.jpeg"
